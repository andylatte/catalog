name: Backup

# Sichert jeden Sonntag Datenbank und Storage-Dateien, verschlüsselt mit
# BACKUP_PASSWORD. Das Ergebnis liegt 90 Tage als Download im Actions-Tab.
# Wiederherstellung: docs/betrieb.md

on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
    steps:
      - name: Einstellungen prüfen
        run: |
          missing=""
          for name in SUPABASE_URL SUPABASE_DB_URL SUPABASE_SECRET_KEY BACKUP_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Fehlt in den Repo-Einstellungen:$missing (siehe docs/betrieb.md)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Postgres-Client 17 installieren
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Datenbank sichern
        run: |
          mkdir -p backup/db
          pg_dump --version
          # Inhalte der App. Die Tabellen selbst entstehen beim Wiederherstellen aus den Migrationen.
          pg_dump "$SUPABASE_DB_URL" --data-only --schema=public --no-owner --no-privileges \
            --file backup/db/public.sql
          # Konto und MFA-Faktor, damit owner_id und Anmeldung nach dem Wiederherstellen passen.
          pg_dump "$SUPABASE_DB_URL" --data-only --no-owner --no-privileges \
            --table auth.users --table auth.identities --table auth.mfa_factors \
            --file backup/db/auth.sql
          # Vollständiges Schema zum Nachschlagen.
          pg_dump "$SUPABASE_DB_URL" --schema-only --schema=public --no-owner --no-privileges \
            --file backup/db/schema.sql

      - name: Dateien sichern
        run: node scripts/backup-storage.mjs backup/storage

      - name: Verschlüsseln
        run: |
          name="backup-$(date -u +%Y-%m-%d)"
          echo "NAME=$name" >> "$GITHUB_ENV"
          tar -czf - -C backup . \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --pinentry-mode loopback \
                --passphrase-file <(printf '%s' "$BACKUP_PASSWORD") \
                --output "$name.tar.gz.gpg"
          rm -rf backup
          ls -lh "$name.tar.gz.gpg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.tar.gz.gpg
          retention-days: 90
          compression-level: 0
