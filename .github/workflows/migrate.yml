name: Migrationen

# Spielt neue Dateien aus supabase/migrations/ in die Supabase-Datenbank ein,
# sobald sie auf main landen. Braucht das Secret SUPABASE_DB_URL.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migrate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - name: Einstellungen prüfen
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::Secret SUPABASE_DB_URL fehlt (siehe docs/betrieb.md)"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Bisherige Migrationen übernehmen
        run: scripts/migrations-baseline.sh

      - name: Ausstehende Migrationen anzeigen
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Migrationen einspielen
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
